<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Hany Chemistry</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mut:#6b7686;--ac:#0f9d8a;--bd:#dfe5ee;--dn:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#8f9bab;--bd:#2a3542}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#8f9bab;--bd:#2a3542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:22px;text-align:center;margin:8px 0 4px}
p.s{margin:0 0 16px;color:var(--mut);font-size:13px;text-align:center}
.day{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.day h2{font-size:16px;margin:0 0 6px;color:var(--ac)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row input{font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 8px;box-sizing:border-box;min-width:0}
.row input:focus{outline:none;border-color:var(--ac)}
.tm{width:84px;text-align:center;direction:ltr;flex:none}
.nm{flex:1}
.del{background:none;border:0;color:var(--dn);font-size:18px;padding:6px 8px;cursor:pointer;flex:none}
.free{color:var(--mut);font-size:14px;margin:2px 0 8px}
.add{font:inherit;font-size:14px;color:var(--ac);background:none;border:1px dashed var(--ac);border-radius:8px;padding:7px 12px;cursor:pointer}
.bar{margin-top:6px;text-align:center}
.rst{font:inherit;font-size:13px;color:var(--mut);background:none;border:0;text-decoration:underline;cursor:pointer}
#m{font-size:12px;color:var(--mut);text-align:center;min-height:16px;margin-top:6px}
</style>
</head>
<body>
<h1 dir="ltr">Mr. Hany Chemistry</h1>
<p class="s">اضغط على الميعاد أو الاسم وعدّل. التعديل بيتحفظ لوحده.</p>
<div id="app"></div>
<div class="bar"><button class="rst" id="rst">رجوع للجدول الأصلي</button></div>
<div id="m"></div>
<script>
var DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
var DEF={"السبت":[["10:00","حبيبا"]],"الأحد":[["4:00","عمر"]],"الاثنين":[["10:00","يوسف"],["6:30","مارك"]],"الثلاثاء":[["9:30","ريناد"],["12:30","ميخا"],["5:00","محمد"]],"الأربعاء":[["2:00","حنين"],["5:30","كارن"]],"الخميس":[["9:00","كيرلس"],["2:30","مينا"]],"الجمعة":[]};
function clone(o){return JSON.parse(JSON.stringify(o))}
var K="hany_sched_v3",data=null;
try{var r=localStorage.getItem(K);data=r?JSON.parse(r):null}catch(e){}
if(!data||typeof data!=="object")data=clone(DEF);
var app=document.getElementById("app"),msg=document.getElementById("m");
function save(){try{localStorage.setItem(K,JSON.stringify(data));msg.textContent="اتحفظ ✓"}catch(e){msg.textContent="مقدرش يحفظ على الجهاز ده"}}
function render(){
 app.innerHTML="";
 DAYS.forEach(function(d){
  var list=data[d]||(data[d]=[]);
  var box=document.createElement("div");box.className="day";
  var h=document.createElement("h2");h.textContent=d;box.appendChild(h);
  if(!list.length){var f=document.createElement("div");f.className="free";f.textContent="فاضي";box.appendChild(f)}
  list.forEach(function(it,i){
   var row=document.createElement("div");row.className="row";
   var t=document.createElement("input");t.className="tm";t.value=it[0];t.placeholder="الميعاد";t.oninput=function(){it[0]=t.value;save()};
   var n=document.createElement("input");n.className="nm";n.value=it[1];n.placeholder="اسم الطالب";n.oninput=function(){it[1]=n.value;save()};
   var x=document.createElement("button");x.className="del";x.textContent="✕";x.setAttribute("aria-label","حذف");
   x.onclick=function(){list.splice(i,1);save();render()};
   row.appendChild(t);row.appendChild(n);row.appendChild(x);box.appendChild(row);
  });
  var a=document.createElement("button");a.className="add";a.textContent="+ حصة";
  a.onclick=function(){list.push(["",""]);save();render();var rows=app.querySelectorAll(".day");var idx=DAYS.indexOf(d);var ins=rows[idx].querySelectorAll(".tm");ins[ins.length-1].focus()};
  box.appendChild(a);app.appendChild(box);
 });
}
document.getElementById("rst").onclick=function(){if(confirm("ترجع الجدول للأصلي؟")){data=clone(DEF);save();render()}};
render();
</script>
</body>
</html>
